name: Sign - unlisted Firefox extension with AMO

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SIGN_MIDORIVPN_2.0.0_UNLISTED_WITH_AMO
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    name: Sign unlisted Firefox package with reviewer source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: extension-store-submit
    env:
      APP_ENV: production
      API_URL: ${{ secrets.API_URL || vars.API_URL }}
      ACCOUNT_URL: ${{ secrets.ACCOUNT_URL || vars.ACCOUNT_URL }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || vars.PUBLIC_BASE_URL }}
      EDGE_PROBE_ORIGINS: ${{ vars.EDGE_PROBE_ORIGINS }}
      AUTHENTIK_ISSUER: ${{ secrets.AUTHENTIK_ISSUER || vars.AUTHENTIK_ISSUER }}
      AUTHENTIK_AUTHORIZATION_URL: ${{ secrets.AUTHENTIK_AUTHORIZATION_URL || vars.AUTHENTIK_AUTHORIZATION_URL }}
      AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID || vars.AUTHENTIK_CLIENT_ID }}
      AUTHENTIK_REDIRECT_URI: ${{ secrets.AUTHENTIK_REDIRECT_URI || vars.AUTHENTIK_REDIRECT_URI }}
      EXTENSION_CALLBACK_PATH: ${{ secrets.EXTENSION_CALLBACK_PATH || vars.EXTENSION_CALLBACK_PATH }}
    steps:
      - name: Checkout annotated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the immutable 2.0.0 release tag
        env:
          AMO_CONFIRM_SUBMISSION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/tags/v2.0.0
          test "$(git cat-file -t v2.0.0)" = tag
          test "$(git rev-list -n 1 v2.0.0)" = "$GITHUB_SHA"
          test "$AMO_CONFIRM_SUBMISSION" = SIGN_MIDORIVPN_2.0.0_UNLISTED_WITH_AMO

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and validate store evidence
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          npm run release:build

      - name: Submit to AMO
        env:
          AMO_CONFIRM_SUBMISSION: ${{ inputs.confirmation }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: bash scripts/submit-amo.sh

      - name: Retain the downloaded unlisted XPI and release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: midorivpn-extension-2.0.0-amo-unlisted
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
