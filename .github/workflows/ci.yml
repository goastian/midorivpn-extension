name: CI - Web Extension

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Lint, Test & Build Extension
    runs-on: ubuntu-24.04
    # CI validates production-mode packaging with reserved test origins.
    # Deployment inputs remain mandatory in the separate release/store jobs.
    env:
      APP_ENV: production
      API_URL: https://vpn.example.test
      ACCOUNT_URL: https://vpn.example.test
      PUBLIC_BASE_URL: https://vpn.example.test
      EDGE_PROBE_ORIGINS: https://de.vpn.example.test
      AUTHENTIK_ISSUER: https://accounts.example.test/application/o/vpn/
      AUTHENTIK_AUTHORIZATION_URL: https://accounts.example.test/application/o/authorize/
      AUTHENTIK_CLIENT_ID: ci-public-client
      AUTHENTIK_REDIRECT_URI: https://vpn.example.test/extension/callback
      EXTENSION_CALLBACK_PATH: /extension/callback
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency graph with reviewed tooling exceptions
        run: npm run audit:security

      - name: TypeCheck (tsc)
        run: npm run typecheck

      - name: Run ESLint with zero warnings
        run: npm run lint -- --max-warnings=0

      - name: Run Vitest Suite with coverage gate
        run: npm run test:coverage

      - name: Build Firefox Extension
        run: npm run build:firefox

      - name: Preserve and lint Firefox package for AMO
        run: |
          rm -rf dist-firefox
          cp -a dist dist-firefox
          npm run lint:firefox-package

      - name: Build Chrome Extension
        run: npm run build:chrome
