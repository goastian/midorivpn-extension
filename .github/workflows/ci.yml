name: CI - Web Extension

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test & Build Extension
    runs-on: ubuntu-24.04
    env:
      APP_ENV: ${{ secrets.APP_ENV || vars.APP_ENV }}
      API_URL: ${{ secrets.API_URL || vars.API_URL }}
      ACCOUNT_URL: ${{ secrets.ACCOUNT_URL || vars.ACCOUNT_URL }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || vars.PUBLIC_BASE_URL }}
      AUTHENTIK_ISSUER: ${{ secrets.AUTHENTIK_ISSUER || vars.AUTHENTIK_ISSUER }}
      AUTHENTIK_AUTHORIZATION_URL: ${{ secrets.AUTHENTIK_AUTHORIZATION_URL || vars.AUTHENTIK_AUTHORIZATION_URL }}
      AUTHENTIK_CLIENT_ID: ${{ secrets.AUTHENTIK_CLIENT_ID || vars.AUTHENTIK_CLIENT_ID }}
      AUTHENTIK_REDIRECT_URI: ${{ secrets.AUTHENTIK_REDIRECT_URI || vars.AUTHENTIK_REDIRECT_URI }}
      EXTENSION_CALLBACK_PATH: ${{ secrets.EXTENSION_CALLBACK_PATH || vars.EXTENSION_CALLBACK_PATH }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency graph with reviewed tooling exceptions
        run: npm run audit:security

      - name: TypeCheck (tsc)
        run: npm run typecheck

      - name: Run ESLint with zero warnings
        run: npm run lint -- --max-warnings=0

      - name: Run Vitest Suite with coverage gate
        run: npm run test:coverage

      - name: Build Firefox Extension
        run: npm run build:firefox

      - name: Preserve and lint Firefox package for AMO
        run: |
          rm -rf dist-firefox
          cp -a dist dist-firefox
          npm run lint:firefox-package

      - name: Build Chrome Extension
        run: npm run build:chrome
