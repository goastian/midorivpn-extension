name: Publish - Chromium package in CWS

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_MIDORIVPN_2.0.0_TO_CWS
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Submit uploaded Chromium package for review
    runs-on: ubuntu-24.04
    environment: extension-store-publish
    steps:
      - name: Checkout annotated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the immutable 2.0.0 release tag
        env:
          CWS_CONFIRM_PUBLISH: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/tags/v2.0.0
          test "$(git cat-file -t v2.0.0)" = tag
          test "$(git rev-list -n 1 v2.0.0)" = "$GITHUB_SHA"
          test "$CWS_CONFIRM_PUBLISH" = PUBLISH_MIDORIVPN_2.0.0_TO_CWS

      - name: Verify the uploaded item state
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PRIVACY_POLICY_URL: ${{ vars.CWS_PRIVACY_POLICY_URL }}
        run: bash scripts/chrome-web-store-api.sh status

      - name: Submit the uploaded item for review and publication
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PRIVACY_POLICY_URL: ${{ vars.CWS_PRIVACY_POLICY_URL }}
          CWS_CONFIRM_PUBLISH: ${{ inputs.confirmation }}
        run: bash scripts/chrome-web-store-api.sh publish
